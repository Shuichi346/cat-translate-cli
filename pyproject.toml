[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cat-translate-cli"
version = "0.2.0"
description = "CAT-Translate-7b GGUF モデルを使った日英・英日翻訳CLIツール（サーバーモード対応）"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "llama-cpp-python>=0.3.2",
    "huggingface-hub>=0.27.0",
    "gradio>=6.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
cat-translate = "cat_translate_cli.cli:main"
cat-translate-server = "cat_translate_cli.server:main"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "vulture>=2.14",
    "deptry>=0.22.0",
    "mypy>=1.14.0",
]

[tool.deptry]
known_first_party = ["cat_translate_cli"]
