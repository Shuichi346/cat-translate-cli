[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"

[project]
name = "cat-translate-cli"
version = "0.3.0"
description = "CAT-Translate-7b GGUF モデルを使った日英・英日翻訳CLIツール（サーバーモード対応）"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Shuichi", email = "your-email@example.com" },
]
keywords = ["translation", "japanese", "english", "cli", "llm", "gguf", "llama-cpp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "llama-cpp-python>=0.3.35,<0.4",
    "huggingface-hub>=1.27.0,<2",
    "gradio>=6.24.0,<7",
    "httpx>=0.28.1,<1",
]

[project.urls]
Homepage = "https://github.com/Shuichi346/cat-translate-cli"
Repository = "https://github.com/Shuichi346/cat-translate-cli"
Issues = "https://github.com/Shuichi346/cat-translate-cli/issues"

[project.scripts]
cat-translate = "cat_translate_cli.cli:main"
cat-translate-server = "cat_translate_cli.server:main"

[dependency-groups]
dev = [
    "ruff>=0.16.3,<1",
    "vulture>=2.16,<3",
    "deptry>=0.25.1,<1",
    "mypy>=2.3.1,<3",
]

[tool.deptry]
known_first_party = ["cat_translate_cli"]
